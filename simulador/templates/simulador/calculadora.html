
<div class="calculadora-integrales">

    <h2>Calculadora de Integrales Múltiples</h2>

    <p>
        Introduce una función y sus límites para
        calcular una integral doble.
    </p>

    <form id="form-calculadora"
          method="post"
          data-url="{% url 'calcular_integral' %}">

        {% csrf_token %}

        <div class="campo">
            <label for="tipo-integral">Tipo de integral</label>
            <select id="tipo-integral" name="tipo">
                <option value="doble">Integral doble</option>
                <option value="triple" disabled>
                    Integral triple (próximamente)
                </option>
            </select>
        </div>

        <div class="campo">
            <label for="coordenadas">
                Sistema de coordenadas
            </label>

            <select id="coordenadas" name="coordenadas">
                <option value="cartesianas">
                    Cartesianas
                </option>
                <option value="polares" disabled>
                    Polares (próximamente)
                </option>
                <option value="cilindricas" disabled>
                    Cilíndricas (próximamente)
                </option>
                <option value="esfericas" disabled>
                    Esféricas (próximamente)
                </option>
            </select>
        </div>

        <div class="campo">
            <label for="funcion">Función f(x,y)</label>

            <input
                type="text"
                id="funcion"
                name="funcion"
                value="x**2 + y**2"
                placeholder="Ej: x**2 + y**2"
                maxlength="100"
                required
            >

            <small>
                Usa ** para potencias.
                Ejemplo: x**2 + y**2
            </small>
        </div>

        <div class="campo">
            <label for="orden">Orden de integración</label>

            <select id="orden" name="orden">
                <option value="dy_dx">dy dx</option>
                <option value="dx_dy">dx dy</option>
            </select>
        </div>

        <fieldset>
            <legend>Límites de integración</legend>

            <div class="limites-grid">
                <div class="campo">
                    <label for="x-min">X inferior</label>
                    <input type="number" step="any"
                           id="x-min" name="x_min"
                           value="0" required>
                </div>

                <div class="campo">
                    <label for="x-max">X superior</label>
                    <input type="number" step="any"
                           id="x-max" name="x_max"
                           value="2" required>
                </div>

                <div class="campo">
                    <label for="y-min">Y inferior</label>
                    <input type="number" step="any"
                           id="y-min" name="y_min"
                           value="0" required>
                </div>

                <div class="campo">
                    <label for="y-max">Y superior</label>
                    <input type="number" step="any"
                           id="y-max" name="y_max"
                           value="2" required>
                </div>
            </div>
        </fieldset>

        <div class="acciones">
            <button type="submit" class="boton-ova">
                Calcular integral
            </button>

            <button type="reset" class="boton-secundario">
                Limpiar
            </button>
        </div>

    </form>

    <div id="resultado-integral"
         role="status"
         aria-live="polite">
        <h3>Resultado</h3>
        <p>
            Introduce los datos y presiona
            "Calcular integral".
        </p>
    </div>

</div>
